# Standard LIBERO spatial task 0 with native OpenPI called from the untouched reset state.

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_spatial
      task_id: 0
      privileged: false
      max_steps: 4000
      control_freq: 20
      seed: 7
    privileged: false
    apis:
      - FrankaLiberoVLAApiReduced
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: {libero_environment_goal}

      This is a standard LIBERO task, and OpenPI is trained directly on LIBERO language instructions from the environment reset state.
      Preserve the exact goal string above. Do not paraphrase it.
      Usually omit `prompt=` entirely so the OpenPI tool uses the exact LIBERO goal.

      Important: do not move the robot to home before the first OpenPI call.
      For standard LIBERO, the closest match to upstream evaluation is to call native OpenPI immediately from the untouched reset observation.

      Preferred strategy:
      - Start by directly calling `execute_openpi_native_plan(replan_steps=5, execute_actions=5)` from the current state.
      - Inspect the returned dict. If `native_done` is true, stop immediately.
      - If `native_done` is false, replan from the new observation with another native OpenPI plan.
      - Only switch to explicit perception / manipulation code if several native replans clearly fail.
      - Do not send the robot to home or open / close the gripper before the first native OpenPI plan unless you have strong evidence that the episode state is already corrupted.

      You may write python code comments for reasoning but ONLY write executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      Goal: {libero_environment_goal}

      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      Task status after that execution:
      - reward: {reward}
      - task_completed: {task_completed}
      - terminated: {terminated}
      - truncated: {truncated}

      For this standard LIBERO task, continue using native OpenPI replans before switching to explicit recovery code.
      Do not add a `goto_home_joint_position()` preamble unless the state is obviously bad.
      Only pivot to explicit perception / motion primitives after repeated native OpenPI replans fail.

      If `task_completed` is false, default to `REGENERATE`.
      Only respond with `FINISH` if `task_completed` is true or the object is clearly placed correctly.

      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
save_multiturn_prompts: true
output_dir: ./outputs/franka_libero_spatial_0_vla_native_eval_hillclimb_v2
use_img_differencing: false
use_parallel_ensemble: false
use_multimodel: false

trials: 1
num_workers: 1
