# LIBERO-PRO object_swap — raw CaP-X baseline (NO VLA).
#
# Uses FrankaLiberoApiReducedSkillLibraryNoVLA which strips every OpenPI /
# VLA helper from the exposed tool list. The coding agent must complete
# the task using only perception (SAM3 / Molmo / ContactGraspNet) and
# motion primitives (goto_pose, IK, gripper primitives).
#
# Useful as a full-suite CaP-X baseline to sit next to the VLA sweeps
# (pure-VLA-native, pure-VLA-IK, hybrid-VLA-native, hybrid-VLA-IK).

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object_swap
      task_id: 0
    privileged: false
    apis:
      - FrankaLiberoApiReducedSkillLibraryNoVLA
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: {libero_environment_goal}

      You have NO access to a learned policy. Complete the task using
      only perception tools (SAM3 text/point prompts, Molmo pointing,
      ContactGraspNet grasp sampling) and motion primitives
      (goto_pose, goto_home_joint_position, open_gripper, close_gripper).

      Suggested pattern:
      - get_observation()
      - localize the TARGET object (use 2-3 synonyms)
      - localize the TARGET container (e.g. the basket)
      - sample a grasp or compute a top-down pregrasp over the object
      - open gripper, move to pregrasp, descend, close gripper, lift
      - move to a position above the container, release gripper

      You may write python code comments for reasoning but ONLY write the
      executable Python code and do not write it in code fences. To use
      numpy, import it explicitly.

    multi_turn_prompt: |
      Goal: {libero_environment_goal}

      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      stdout:
      ```
      {console_stdout}
      ```
      stderr:
      ```
      {console_stderr}
      ```
      status: reward={reward}, task_completed={task_completed}, terminated={terminated}, truncated={truncated}

      If there were errors, fix them. If progress is partial, continue.
      Only respond FINISH once the object is visually confirmed placed
      in the target container.

      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a
        fenced code block (```python...```).
      - The word 'FINISH' if the task appears to be complete.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/franka_libero_object_swap_clean_novla
save_multiturn_prompts: true

trials: 20
num_workers: 4
